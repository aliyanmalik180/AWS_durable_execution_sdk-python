name: Stale Issue Closer

on:
  schedule:
    # GitHub can delay scheduled workflows and may drop runs scheduled at the
    # top of the hour during high-load periods.
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@7b42d73fec5bcb976dfe554b4b71ed3fdbc3318c
